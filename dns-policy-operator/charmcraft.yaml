name: dns-policy
type: charm
subordinate: true
title: DNS policy charm
summary: A very short one-line summary of the charm.
links:
  documentation: https://canonical.com/juju/docs/dns-charms

description: |
bases:
  - build-on:
    - name: ubuntu
      channel: "22.04"
    run-on:
    - name: ubuntu
      channel: "22.04"

config:
  options:
    debug:
      type: boolean
      description: "Whether dns-policy-app debug mode is enabled."
      default: false
    allowed-hosts:
      type: string
      description: A comma-separated list of host/domain names that the dns-policy-app API
        can serve. This configuration will set the DJANGO_ALLOWED_HOSTS environment
        variable with its content being a JSON encoded list.
      default: "0.0.0.0"
    ddns-domain:
      type: string
      description: >
        The domain suffix of the automatically allocated domains. Setting this option
        enables the automatically allocated domain feature: every requirer integrated on
        the dns-record-provider endpoint is allocated a unique domain under this suffix,
        which is published back to it through the relation. The charm requests an A or
        AAAA record for that domain, and a wildcard record for its subdomains, from the
        upstream DNS provider. While this option is set, any DNS record request for this
        domain or one of its subdomains is rejected. Leave empty to disable the feature.
      default: ""

requires:
  database:
    interface: postgresql_client
    limit: 1
  dns-record-requirer:
    interface: dns_record
    scope: container
    limit: 1

provides:
  dns-record-provider:
    interface: dns_record

peers:
  dns-policy-peers:
    interface: dns_policy_peers

parts:
  charm:
    build-snaps:
      - rustup
    override-build: |
      rustup default stable
      craftctl default

actions:
  create-reviewer:
    description: Create a reviewer
    params:
      username:
        type: string
        description: Username
      email:
        type: string
        description: Email
    required:
      - username
      - email
